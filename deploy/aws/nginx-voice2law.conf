# Voice2Law — nginx site config
# Copy to: /etc/nginx/sites-available/voice2law
# Enable: sudo ln -sf /etc/nginx/sites-available/voice2law /etc/nginx/sites-enabled/
#         sudo rm -f /etc/nginx/sites-enabled/default
#         sudo nginx -t && sudo systemctl reload nginx
#
# Serves Vite build/ and proxies /api to Express on :5000.
# NLP (FastAPI :8001) stays on 127.0.0.1 only — NOT exposed via nginx.

server {
    listen 80;
    server_name _;   # replace with your domain when you have one

    root /home/ubuntu/voice2law/build;
    index index.html;

    client_max_body_size 50m;

    # Express API (port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # React SPA — client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

